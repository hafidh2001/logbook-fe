# Include INSIDE the HTTPS server{} serving logbook-fe's dist/.
# Fixed upstream only; do not turn this into a URL/host parameter proxy.
location = /mobile-api/index.php {
    if ($request_method !~ ^(GET|POST|OPTIONS)$) { return 405; }
    if ($args !~ "^r=apiMobileService/[A-Za-z][A-Za-z0-9]*(&id_user=[1-9][0-9]*&id_client=[1-9][0-9]*)?$") { return 404; }
    client_max_body_size 55m;
    proxy_read_timeout 190s;
    proxy_send_timeout 190s;
    proxy_request_buffering on;
    proxy_cache off;
    # The current Mobile protocol is stateless JSON/body identity, not Web cookies.
    # Never forward Institution cookies, Authorization, CSRF or arbitrary headers.
    proxy_pass_request_headers off;
    proxy_set_header Host hachi.kelava.id;
    proxy_set_header Content-Type $content_type;
    proxy_set_header Accept application/json;
    proxy_ssl_server_name on;
    proxy_ssl_name hachi.kelava.id;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_hide_header Set-Cookie;
    add_header Cache-Control "no-store" always;
    proxy_intercept_errors on;
    error_page 301 302 303 307 308 = @mobile_upstream_redirect_rejected;
    rewrite ^ /index.php break;
    # No URI/query here: rewrite changes only the path, retaining exact PHP r= args.
    proxy_pass https://hachi.kelava.id;
}
location ^~ /mobile-api/ { return 404; }
location @mobile_upstream_redirect_rejected { return 502; }
